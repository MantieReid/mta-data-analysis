# Local WordPress for testing the plugin.
# 1. Copy .env.example to .env and set your own throwaway passwords (.env is not committed).
# 2. docker compose up -d, then open http://localhost:8088
services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  wordpress:
    image: wordpress:6.6-php8.2-apache
    depends_on: [db]
    ports: ["8088:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp:/var/www/html
      - ./mta-ridership:/var/www/html/wp-content/plugins/mta-ridership
  cli:
    image: wordpress:cli-php8.2
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp:/var/www/html
      - ./mta-ridership:/var/www/html/wp-content/plugins/mta-ridership
    entrypoint: ["wp"]
volumes:
  wp:
